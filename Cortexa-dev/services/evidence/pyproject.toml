[project]
name = "evidence"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "tenacity>=8.3",
    "uvicorn[standard]>=0.29",
    "azure-keyvault-secrets>=4.8",
    "azure-identity>=1.17",
    "azure-cosmos>=4.7",
    "azure-servicebus>=7.12",
    "aiohttp>=3.9",
    "sentry-sdk[fastapi]>=2.44,<3",
]

[project.optional-dependencies]
bigquery = [
    "pyjwt>=2.10",
    "cryptography>=44.0",
]

[tool.uv]
package = true
sources = { evidence = { path = "src" } }
dev-dependencies = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "pip-audit>=2.7",
    "pytest-mock>=3.14",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
