[project]
name = "vector-router"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "azure-search-documents>=11.4",
    "qdrant-client>=1.9",
    "azure-keyvault-secrets>=4.8",
    "azure-identity>=1.17",
    "uvicorn[standard]>=0.29",
    "aiohttp>=3.9",
    "sentry-sdk[fastapi]>=2.44,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vector_router"]

[tool.uv]
package = true
dev-dependencies = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "pip-audit>=2.7",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
