name: Build and Push Service Image

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      acr_login_server:
        required: true
        type: string
      extra_tag:
        description: 'Additional image tag to push alongside github.sha (e.g. a version tag). Leave empty to skip.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build-push:
    name: build-push / ${{ inputs.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Azure login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name "$(cut -d. -f1 <<< '${{ inputs.acr_login_server }}')"

      - name: Build image
        run: |
          docker build \
            -t "${{ inputs.acr_login_server }}/${{ inputs.service }}:${{ github.sha }}" \
            -f "services/${{ inputs.service }}/Dockerfile" \
            "services/${{ inputs.service }}"

      - name: Push image
        run: docker push "${{ inputs.acr_login_server }}/${{ inputs.service }}:${{ github.sha }}"

      - name: Tag and push extra tag
        if: inputs.extra_tag != ''
        run: |
          docker tag \
            "${{ inputs.acr_login_server }}/${{ inputs.service }}:${{ github.sha }}" \
            "${{ inputs.acr_login_server }}/${{ inputs.service }}:${{ inputs.extra_tag }}"
          docker push "${{ inputs.acr_login_server }}/${{ inputs.service }}:${{ inputs.extra_tag }}"
