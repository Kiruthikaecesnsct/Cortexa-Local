name: Detect Changed Paths

on:
  workflow_call:
    outputs:
      ingestion:
        value: ${{ jobs.changes.outputs.ingestion }}
      extraction:
        value: ${{ jobs.changes.outputs.extraction }}
      evidence:
        value: ${{ jobs.changes.outputs.evidence }}
      vector-router:
        value: ${{ jobs.changes.outputs.vector-router }}
      scoring:
        value: ${{ jobs.changes.outputs.scoring }}
      seeding:
        value: ${{ jobs.changes.outputs.seeding }}
      harvesting:
        value: ${{ jobs.changes.outputs.harvesting }}
      api-gateway:
        value: ${{ jobs.changes.outputs.api-gateway }}
      identity:
        value: ${{ jobs.changes.outputs.identity }}
      model-router:
        value: ${{ jobs.changes.outputs.model-router }}
      job-orchestrator:
        value: ${{ jobs.changes.outputs.job-orchestrator }}
      frontend:
        value: ${{ jobs.changes.outputs.frontend }}
      ci-config:
        value: ${{ jobs.changes.outputs.ci-config }}
      iac:
        value: ${{ jobs.changes.outputs.iac }}
      services:
        value: ${{ jobs.changes.outputs.services }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ingestion: ${{ steps.filter.outputs.ingestion }}
      extraction: ${{ steps.filter.outputs.extraction }}
      evidence: ${{ steps.filter.outputs.evidence }}
      vector-router: ${{ steps.filter.outputs.vector-router }}
      scoring: ${{ steps.filter.outputs.scoring }}
      seeding: ${{ steps.filter.outputs.seeding }}
      harvesting: ${{ steps.filter.outputs.harvesting }}
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      identity: ${{ steps.filter.outputs.identity }}
      model-router: ${{ steps.filter.outputs.model-router }}
      job-orchestrator: ${{ steps.filter.outputs.job-orchestrator }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ci-config: ${{ steps.filter.outputs.ci-config }}
      iac: ${{ steps.filter.outputs.iac }}
      services: ${{ steps.matrix.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Detect changed paths
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            ingestion:
              - 'services/ingestion/**'
            extraction:
              - 'services/extraction/**'
            evidence:
              - 'services/evidence/**'
            vector-router:
              - 'services/vector-router/**'
            scoring:
              - 'services/scoring/**'
            seeding:
              - 'services/seeding/**'
            harvesting:
              - 'services/harvesting/**'
            api-gateway:
              - 'services/api-gateway/**'
            identity:
              - 'services/identity/**'
            model-router:
              - 'services/model-router/**'
            job-orchestrator:
              - 'services/job-orchestrator/**'
            frontend:
              - 'frontend/**'
            ci-config:
              - '.github/workflows/**'
            iac:
              - 'deploy/**'

      - name: Build changed-services JSON array
        id: matrix
        run: |
          services='[]'
          add() { services=$(printf '%s' "$services" | jq -c --arg v "$1" '. + [$v]'); }
          [ "${{ steps.filter.outputs.ingestion }}"       = "true" ] && add ingestion
          [ "${{ steps.filter.outputs.extraction }}"      = "true" ] && add extraction
          [ "${{ steps.filter.outputs.evidence }}"        = "true" ] && add evidence
          [ "${{ steps.filter.outputs.vector-router }}"   = "true" ] && add vector-router
          [ "${{ steps.filter.outputs.scoring }}"         = "true" ] && add scoring
          [ "${{ steps.filter.outputs.seeding }}"         = "true" ] && add seeding
          [ "${{ steps.filter.outputs.harvesting }}"      = "true" ] && add harvesting
          [ "${{ steps.filter.outputs.api-gateway }}"     = "true" ] && add api-gateway
          [ "${{ steps.filter.outputs.identity }}"        = "true" ] && add identity
          [ "${{ steps.filter.outputs.model-router }}"    = "true" ] && add model-router
          [ "${{ steps.filter.outputs.job-orchestrator }}" = "true" ] && add job-orchestrator
          echo "services=$services" >> "$GITHUB_OUTPUT"
