# Production-image nginx config: SPA fallback + /api reverse proxy to
# api-gateway. Not used in preview mode (the preview override runs the Vite
# dev server instead, see vite.config.ts's own /api proxy).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Port 5000 matches api-gateway/Dockerfile's ASPNETCORE_HTTP_PORTS - the
        # production image, which is what runs in the base (non-preview) stack.
        proxy_pass http://api-gateway:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
