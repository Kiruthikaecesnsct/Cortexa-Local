<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cortexa — patent opportunity discovery platform" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Cortexa</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Font preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Sora (display) + Geist (UI/body) + Geist Mono (data) — Cortexa design system -->
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var t = localStorage.getItem('cortexa.theme');
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      } catch (_) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Deploy verification marker. Lives outside #root so React never removes it;
         %VITE_APP_VERSION% is substituted at build time with the git SHA. Confirms
         which build the SWA production slot is actually serving. -->
    <div id="build-stamp" style="position:fixed;bottom:6px;right:8px;z-index:99999;font:11px/1.4 monospace;color:#888;background:rgba(0,0,0,0.06);padding:2px 6px;border-radius:4px;pointer-events:none">build %VITE_APP_VERSION%</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
