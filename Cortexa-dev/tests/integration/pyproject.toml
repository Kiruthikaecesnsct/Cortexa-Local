[project]
name = "cortexa-integration"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "azure-identity>=1.17",
    "azure-keyvault-secrets>=4.8",
    "pydantic-settings>=2.4",
    "pydantic>=2.8",
]

[project.optional-dependencies]
cosmos = ["azure-cosmos>=4.7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
