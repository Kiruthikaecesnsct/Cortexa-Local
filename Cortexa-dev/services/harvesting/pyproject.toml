[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harvesting"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "uvicorn[standard]>=0.29",
    "azure-cosmos>=4.5",
    "azure-identity>=1.17",
    "azure-servicebus>=7.12",
    "aiohttp>=3.9",
    "sentry-sdk[fastapi]>=2.44,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/harvesting"]

[tool.uv]
package = true
dev-dependencies = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "pip-audit>=2.7",
    "pytest-mock>=3.14",
]

[tool.uv.sources]
harvesting = { path = "src" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
