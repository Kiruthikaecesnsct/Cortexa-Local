<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>US134 GitHub and Azure DevOps sources - design prototype</title>
<style>
/* Tokens mirror Themes/Colors.Light.xaml and Styles.xaml (same set as US128/US133). Prototype only.
   The "High contrast" toggle approximates Colors.HighContrast.xaml (SystemColors, HC Black). */
:root{
  --surface-page:#F6F7FC;--surface-card:#FFFFFF;--surface-rail:#EEF0FA;--surface-sunken:#EEF0F8;--surface-selected:#E3E6FB;
  --border-subtle:#E3E6F0;--border-control:#8A93A8;--border-focus:#4653E8;--button-edge:transparent;
  --text-primary:#171A30;--text-body:#464D6E;--text-muted:#5F6684;--text-disabled:#9AA1B8;--text-link:#3945D6;--text-on-accent:#FFFFFF;--text-on-selected:#171A30;
  --accent:#4653E8;--danger:#C4283F;--danger-surface:#FCEBED;--success:#0B7A53;--success-surface:#E7F5EF;
  --warning:#9A4A08;--warning-surface:#FEF3E2;--info-surface:#EAECFD;--info:#3945D6;
  --fs-caption:12px;--fs-body:14px;--fs-subtitle:18px;--fs-title:24px;
  --r-control:8px;--r-card:14px;--r-chip:999px;
  --content-max:720px;--workspace-max:960px;--row-action:44px;--row-min:64px;--combo-min:220px;--action-min:96px;
  --repo-list-max:352px; /* NEW Size.RepoListMaxHeight: 5.5 rows of 64px so a cut-off row hints at scrolling */
}
body.hc{
  --surface-page:#000;--surface-card:#000;--surface-rail:#000;--surface-sunken:#000;--surface-selected:#1AEBFF;
  --border-subtle:#FFF;--border-control:#FFF;--border-focus:#1AEBFF;--button-edge:#FFF;
  --text-primary:#FFF;--text-body:#FFF;--text-muted:#FFF;--text-disabled:#3FF23F;--text-link:#FFFF00;--text-on-accent:#000;--text-on-selected:#000;
  --accent:#1AEBFF;--danger:#FFF;--danger-surface:#000;--success:#FFF;--success-surface:#000;
  --warning:#FFF;--warning-surface:#000;--info-surface:#000;--info:#FFF;
}
*{box-sizing:border-box}
body{margin:0;font:var(--fs-body)/1.4 "Segoe UI Variable Text","Segoe UI",sans-serif;color:var(--text-body);background:var(--surface-page)}
.mono{font-family:"Cascadia Mono",Consolas,monospace}
.proto-bar{background:#171A30;color:#fff;padding:8px 16px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}
.proto-bar .grp{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-right:10px}
.proto-bar button{font:inherit;padding:3px 8px;border-radius:6px;border:1px solid #8A93A8;background:#2a2f52;color:#fff;cursor:pointer}
.proto-bar button[aria-pressed=true]{background:#4653E8;border-color:#4653E8}
.window{display:grid;grid-template-columns:232px 1fr;min-height:calc(100vh - 40px);min-width:880px}
.rail{background:var(--surface-rail);padding:16px 0;border-right:1px solid var(--button-edge)}
.rail .nav{height:44px;display:flex;align-items:center;gap:12px;padding:0 12px 0 24px;color:var(--text-primary);position:relative}
.rail .nav.sel{background:var(--surface-selected);color:var(--text-on-selected);font-weight:600}
.rail .nav.sel::before{content:"";position:absolute;left:8px;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--accent)}
body.hc .rail .nav.sel::before{background:var(--text-on-selected)}
.content{padding:24px 32px 32px}
.ws{max-width:var(--workspace-max)}
.ws.narrow{max-width:var(--content-max)}
h1{font:600 var(--fs-title) "Segoe UI Variable Display","Segoe UI";color:var(--text-primary);margin:0 0 16px}
h2{font:600 var(--fs-subtitle) "Segoe UI Variable Display","Segoe UI";color:var(--text-primary);margin:0}
h3{font:600 var(--fs-body) "Segoe UI";color:var(--text-primary);margin:0}
.caption{font-size:var(--fs-caption);color:var(--text-muted)}
.helper{font-size:var(--fs-caption);color:var(--text-muted)}
.label{font-weight:600;color:var(--text-primary)}
.err{color:var(--danger);font-size:var(--fs-caption)}
.ok{color:var(--success);font-size:var(--fs-caption)}
.card{background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--r-card);padding:24px;margin-bottom:24px}
.card-h{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.card-h .g{color:var(--text-primary);width:20px;text-align:center}
.intro{margin:0 0 16px}
.divider{border-top:1px solid var(--border-subtle)}
:focus-visible{outline:2px solid var(--border-focus);outline-offset:2px;border-radius:10px}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:8px 16px;min-height:40px;cursor:pointer;white-space:nowrap}
.btn-primary{border:1px solid var(--button-edge);background:var(--accent);color:var(--text-on-accent)}
.btn-secondary{border:1px solid var(--border-control);background:var(--surface-card);color:var(--text-primary);min-width:var(--action-min)}
.btn-secondary:hover{background:var(--surface-selected);color:var(--text-on-selected)}
.btn-danger{border:1px solid var(--button-edge);background:var(--danger);color:#fff}
body.hc .btn-danger{background:#000;color:#fff}
.btn:disabled{background:var(--surface-sunken);color:var(--text-disabled);border-color:var(--text-disabled);cursor:default}
.link-btn{border:0;background:transparent;color:var(--text-link);font:inherit;font-weight:600;padding:8px 12px;min-height:40px;cursor:pointer;white-space:nowrap}
.link-btn:hover{text-decoration:underline}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border:0;background:transparent;border-radius:8px;cursor:pointer;color:var(--text-primary);font-size:16px}
.icon-btn:hover{background:var(--surface-selected)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--r-chip);font-size:12px;background:var(--surface-sunken);color:var(--text-muted);white-space:nowrap;border:1px solid var(--button-edge)}
.tag.warning{background:var(--warning-surface);color:var(--warning)}
.tag.danger{background:var(--danger-surface);color:var(--danger)}
.tag.success{background:var(--success-surface);color:var(--success)}
.tag.info{background:var(--info-surface);color:var(--info)}
.banner{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--info);background:var(--info-surface);border-radius:8px;padding:12px 12px 12px 16px;margin-bottom:16px}
.banner.error{border-color:var(--danger);background:var(--danger-surface)}
.banner.warning{border-color:var(--warning);background:var(--warning-surface)}
.banner.success{border-color:var(--success);background:var(--success-surface)}
.banner .g{width:20px;text-align:center;color:var(--info)}
.banner.error .g{color:var(--danger)}.banner.warning .g{color:var(--warning)}.banner.success .g{color:var(--success)}
.banner .msg{flex:1;color:var(--text-body)}
.banner .acts{display:flex;gap:4px;flex-wrap:wrap}
.field{margin-bottom:16px}
.field label{display:block;font-weight:600;color:var(--text-primary);padding-bottom:4px}
.field label u{text-decoration:underline}
.input{font:inherit;color:var(--text-primary);background:var(--surface-card);border:1px solid var(--border-control);border-radius:8px;padding:8px 12px;min-height:40px;width:100%}
.input:focus{outline:none;border:2px solid var(--border-focus);padding:7px 11px}
.input.bad{border-color:var(--danger)}
.input:disabled{color:var(--text-disabled);border-color:var(--text-disabled);background:var(--surface-sunken)}
.inline{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.inline .grow{flex:1 1 260px}
.inline .field{margin-bottom:0}
select.input{min-width:var(--combo-min);width:auto}
.progress{height:2px;background:var(--surface-sunken);position:relative;overflow:hidden;margin:8px 0}
body.hc .progress{outline:1px solid #fff}
.progress span{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.progress.ind span{width:30%;animation:ind 1.4s linear infinite}
@keyframes ind{from{left:-30%}to{left:100%}}
/* Source selector: FilterChip (RadioButton) group */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:var(--row-action);padding:0 16px;border-radius:var(--r-chip);border:1px solid var(--border-control);background:var(--surface-card);color:var(--text-body);font:inherit;cursor:pointer}
.chip[aria-checked=true]{background:var(--surface-selected);border-color:var(--accent);color:var(--text-on-selected);font-weight:600}
.chip:disabled{color:var(--text-disabled);border-color:var(--text-disabled);cursor:default}
/* Settings key row (mirrors AiKeyRowView) */
.krow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;min-height:var(--row-min)}
.krow .acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.confirm{padding:0 0 12px}
.editor{padding:0 0 16px}
/* Repository list */
.repo-list{max-height:var(--repo-list-max);overflow-y:auto;border:1px solid var(--border-subtle);border-radius:8px}
.repo{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;padding:12px 16px;min-height:var(--row-min);border-top:1px solid var(--border-subtle);cursor:pointer}
.repo:first-child{border-top:0}
.repo:hover,.repo[aria-selected=true]{background:var(--surface-selected);color:var(--text-on-selected)}
.repo[aria-selected=true] .label,.repo[aria-selected=true] .caption{color:var(--text-on-selected)}
.repo .g{text-align:center;color:var(--text-muted)}
.repo .tags{display:flex;gap:6px}
.repo .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-state{padding:32px 16px;text-align:center}
.list-state .big{font-size:28px;color:var(--text-muted);margin-bottom:8px}
.count-line{margin:8px 0}
.fetch-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
.run{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.summary{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center}
/* Documents (existing, abbreviated) */
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.toolbar .spacer{flex:1}
.doc{display:grid;grid-template-columns:24px 1fr auto auto;gap:12px;align-items:center;padding:12px 0;min-height:var(--row-min);border-top:1px solid var(--border-subtle)}
.doc:first-of-type{border-top:0}
.doc .src{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;gap:24px}
.stats .v{font:600 var(--fs-title) "Segoe UI Variable Display";color:var(--text-primary)}
.empty{text-align:center;padding:16px 24px}
.empty .big{font-size:40px;color:var(--text-muted);margin-bottom:8px}
/* Live region echo + annotations (same convention as US133) */
.live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.live-echo{margin-top:8px;font-size:12px;color:var(--text-muted)}
.live-echo b{color:var(--text-primary)}
.annot{margin-top:24px;font-size:12px;color:var(--text-muted);border-left:3px solid var(--accent);padding-left:12px}
.annot h3{font-size:13px;margin:12px 0 4px}
.annot ul{margin:4px 0;padding-left:18px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="proto-bar" role="toolbar" aria-label="Prototype states">
  <strong>US134 prototype</strong>
  <span class="grp">Settings:
    <button data-s="s-checking">Checking</button>
    <button data-s="s-notset">Not set</button>
    <button data-s="s-editor">Editor open</button>
    <button data-s="s-set">Set + saved</button>
    <button data-s="s-confirm">Confirm clear</button>
    <button data-s="s-unknown">Unknown</button>
  </span>
  <span class="grp">Extract:
    <button data-s="x-local">Local (unchanged)</button>
    <button data-s="gh-loading">GitHub loading</button>
    <button data-s="gh-list" aria-pressed="true">GitHub list</button>
    <button data-s="gh-empty">GitHub empty</button>
    <button data-s="gh-nomatch">No search match</button>
    <button data-s="gh-branch">Branch loading</button>
    <button data-s="gh-big">Over 500 MB selected</button>
    <button data-s="ado-noorg">ADO no org</button>
    <button data-s="ado-orgerr">ADO org error</button>
    <button data-s="ado-loading">ADO loading</button>
    <button data-s="ado-list">ADO list</button>
  </span>
  <span class="grp">Fetch:
    <button data-s="f-tree">Reading tree</button>
    <button data-s="f-count">Fetching</button>
    <button data-s="f-rate">Rate-limit pause</button>
    <button data-s="f-canceled">Canceled</button>
    <button data-s="t-parsing">Parsing (transition)</button>
    <button data-s="t-done">Done</button>
    <button data-s="e-trunc">Truncated</button>
  </span>
  <span class="grp">Errors:
    <button data-s="e-missing">MissingToken</button>
    <button data-s="e-auth">Auth</button>
    <button data-s="e-denied">AccessDenied</button>
    <button data-s="e-sso">SsoRequired</button>
    <button data-s="e-notfound">NotFound</button>
    <button data-s="e-empty">EmptyRepository</button>
    <button data-s="e-toolarge">RepositoryTooLarge</button>
    <button data-s="e-upstream">Upstream</button>
  </span>
  <span class="grp"><button id="hcToggle" aria-pressed="false">High contrast</button></span>
</div>

<div class="window">
  <nav class="rail" aria-label="Screens">
    <div class="nav">Sign in</div>
    <div class="nav" id="navExtract">Extract</div>
    <div class="nav">Review</div>
    <div class="nav">History</div>
    <div class="nav" id="navSettings">Settings</div>
  </nav>
  <main class="content">
    <div class="ws" id="screen"></div>
    <div class="ws">
      <div class="live" id="live" aria-live="polite" role="status"></div>
      <div class="live-echo">Screen reader announcement (live region, shown here for review): <b id="liveEcho">none</b></div>
      <div class="annot" id="annot"></div>
    </div>
  </main>
</div>

<script>
/* ---------- Strings (proposed RemoteSourceStrings + SettingsStrings additions) ---------- */
const P={gh:"GitHub",ado:"Azure DevOps"};
const S={
 // Settings
 repoTitle:"Repository access",
 repoIntro:"Personal access tokens for fetching code from GitHub and Azure DevOps. They are stored in Windows Credential Manager on this computer and are never shown again after you save them.",
 ghDesc:"Lists and fetches your GitHub repositories.",
 ghHint:"Classic token: repo scope. Fine-grained token: Contents (Read) and Metadata (Read).",
 adoDesc:"Lists and fetches repositories in Azure Repos.",
 adoHint:"Scope: Code (Read). Create it in the organization you fetch from, or for all accessible organizations.",
 chipSet:"Set",chipNotSet:"Not set",chipChecking:"Checking…",chipUnknown:"Unknown",
 statusUnknown:"Couldn't read the token status. Reopen Settings to try again.",
 addToken:"Add token",replace:"Replace",clear:"Clear",
 editorLabel:p=>`New ${p} personal access token`,
 editorHelper:"Paste the token from your account settings. It won't be shown again.",
 saveToken:"Save token",cancel:"Cancel",pasteFirst:"Paste the token first.",
 tokenSaved:p=>`${p} token saved.`,tokenCleared:p=>`${p} token cleared.`,
 confirmClear:p=>`Remove the ${p} token from this computer? ${p} fetches won't work until you add a token again.`,
 clearToken:"Clear token",keepToken:"Keep token",clearing:"Clearing…",
 // Extract: source
 sourceGroup:"Source", local:"Local files", gh:"GitHub", ado:"Azure DevOps",
 repoCard:"Repository",
 orgLabel:"Organization", orgHelper:"The name after dev.azure.com/. Saved on this computer.",
 orgEmpty:"Enter the organization name.",
 orgNotFound:o=>`Couldn't find the organization "${o}". Check the spelling, or check that your token was created for it.`,
 loadRepos:"Load repositories", loadingRepos:"Loading repositories…", reload:"Reload repositories",
 search:"Search repositories", searchPh:"Filter by name",
 showing:(v,t)=>`Showing ${v} of ${t}`,
 reposEmptyTitle:"No repositories to show",
 reposEmptyGh:"This token can't see any repositories. Check its scopes and which repositories it can access, then reload.",
 reposEmptyAdo:o=>`This token can't see any repositories in ${o}. Check that it has Code (Read) for this organization, then reload.`,
 noMatch:q=>`No repositories match "${q}".`,
 clearSearch:"Clear search",
 privateTag:"Private", tooBigTag:"Over 500 MB",
 branchLabel:"Branch", loadingBranches:"Loading branches…", defaultSuffix:" (default)", commit:sha=>`Commit ${sha}`,
 fetch:"Fetch files", fetchHelp:"Pick a repository first.",
 fetchNote:"Downloads text and code files from the branch. Files already cached on this computer aren't downloaded again.",
 tooBigHelp:s=>`This repository is about ${s}. The fetch limit is 500 MB.`,
 // Fetch run
 fetchingTitle:(r,b)=>`Fetching ${r} @ ${b}`,
 readingTree:"Reading the file list…",
 progress:(d,t,c,k)=>`Fetched ${d} of ${t} files · ${c} from cache · ${k} skipped`,
 paused:(d,t,c,k)=>`Paused. Fetched ${d} of ${t} files · ${c} from cache · ${k} skipped`,
 cancelFetch:"Cancel", cancelFetchName:"Cancel repository fetch",
 rateTitle:p=>p===P.gh?"GitHub rate limit reached.":"Azure DevOps is limiting requests.",
 rateMsg:t=>`Resuming in ${t}. The fetch continues on its own.`,
 rateAnnounce:(p,a)=>`${p===P.gh?"GitHub rate limit reached.":"Azure DevOps is limiting requests."} Resuming in ${a}.`,
 resumed:"Fetch resumed.",
 canceledTitle:"Fetch canceled.", canceledMsg:"Nothing was added. Files already downloaded stay in the cache, so the next fetch is faster.",
 // Done + transition
 summary:(d,c,f,l)=>`Fetched ${d} files · ${c} from cache · ${f+l} skipped (${f} by filter, ${l} too large)`,
 changeRepo:"Change repository", fetchAgain:"Fetch again",
 // Errors
 missingTitle:p=>`Add your ${p} token in Settings.`,
 missingMsg:p=>`Listing and fetching ${p} repositories uses your own personal access token.`,
 openSettings:"Open Settings", tryAgain:"Try again",
 authTitle:p=>`${p} didn't accept your token.`,
 authMsg:"It may have expired or been revoked. Replace it in Settings, then try again.",
 deniedTitle:"Your token can't read this repository.",
 deniedMsg:(r,p)=>p===P.gh?`Give the token Contents (Read) access to ${r}, or pick another repository.`:`Give the token Code (Read) access to ${r}, or pick another repository.`,
 ssoTitle:o=>`Authorize your token for ${o} single sign-on.`,
 ssoMsg:o=>`${o} uses SAML single sign-on. On GitHub, open your token settings, choose Configure SSO, and authorize ${o}. Then try again.`,
 openGhTokens:"Open GitHub token settings",
 notFoundTitle:"Repository or branch not found.",
 notFoundMsg:(r,b)=>`${r} @ ${b} may have been renamed, moved, or deleted. Reload the list and pick it again.`,
 emptyTitle:"This repository is empty.",
 emptyMsg:(r,b)=>`${r} has no files on ${b}. Pick another repository or branch.`,
 tooLargeTitle:"This repository is too large to fetch.",
 tooLargeMsg:(r,s)=>`${r} is ${s}. The limit is 500 MB. Clone it yourself, then use Local files with the folders you need.`,

 upstreamMsg:c=>`The service returned an error (${c}). Try again in a few minutes.`,
 truncTitle:"Some files weren't fetched.",
 truncMsg:(p,d)=>`${p} returned only part of the file list because the repository is very large. ${d} files were fetched. Use Local files for anything missing.`,
 dismiss:"Dismiss"
};
/* ---------- Domain data (RemoteRepository / RemoteBranch shapes) ---------- */
const GH=[
 {Provider:"GitHub",Owner:"contoso-research",Name:"pricing-engine",FullName:"contoso-research/pricing-engine",DefaultBranch:"main",SizeBytes:50540134,IsPrivate:true},
 {Provider:"GitHub",Owner:"contoso-research",Name:"ingest-pipeline",FullName:"contoso-research/ingest-pipeline",DefaultBranch:"main",SizeBytes:13316915,IsPrivate:true},
 {Provider:"GitHub",Owner:"contoso-research",Name:"patent-notes",FullName:"contoso-research/patent-notes",DefaultBranch:"develop",SizeBytes:3250585,IsPrivate:false},
 {Provider:"GitHub",Owner:"contoso-research",Name:"thesis-2025",FullName:"contoso-research/thesis-2025",DefaultBranch:"master",SizeBytes:224395264,IsPrivate:true},
 {Provider:"GitHub",Owner:"contoso-research",Name:"sensor-fusion",FullName:"contoso-research/sensor-fusion",DefaultBranch:"main",SizeBytes:778043392,IsPrivate:true},
 {Provider:"GitHub",Owner:"alpha-dev",Name:"docs-site",FullName:"alpha-dev/docs-site",DefaultBranch:"main",SizeBytes:917504,IsPrivate:false},
 {Provider:"GitHub",Owner:"contoso-research",Name:"token-guard",FullName:"contoso-research/token-guard",DefaultBranch:"main",SizeBytes:2202009,IsPrivate:true}
];
const ADO=[
 {Provider:"AzureDevOps",Organization:"contoso",Project:"Research",Name:"pricing-engine",FullName:"contoso/Research/pricing-engine",DefaultBranch:"main",SizeBytes:41943040,IsPrivate:true},
 {Provider:"AzureDevOps",Organization:"contoso",Project:"Research",Name:"firmware-core",FullName:"contoso/Research/firmware-core",DefaultBranch:"develop",SizeBytes:96468992,IsPrivate:true},
 {Provider:"AzureDevOps",Organization:"contoso",Project:"Platform",Name:"identity-service",FullName:"contoso/Platform/identity-service",DefaultBranch:"main",SizeBytes:8388608,IsPrivate:true},
 {Provider:"AzureDevOps",Organization:"contoso",Project:"Platform",Name:"shared-docs",FullName:"contoso/Platform/shared-docs",DefaultBranch:"main",SizeBytes:524288,IsPrivate:true}
];
const BRANCHES=[{Name:"main",CommitSha:"3f2a9c1e"},{Name:"develop",CommitSha:"9b1e0d47"},{Name:"release/2026.10",CommitSha:"c47a2f80"},{Name:"feature/token-guard",CommitSha:"1d8e33ab"}];
const LIMIT=500*1024*1024;
/* Glyphs: existing Glyphs.* where possible. NEW glyphs: verify code points in Segoe Fluent Icons. */
const G={lock:"&#x1F512;",repo:"&#x2630;",branch:"&#x2442;",search:"&#x2315;",info:"&#x24D8;",err:"&#x2715;",warn:"&#x26A0;",ok:"&#x2713;",key:"&#x26BF;",code:"&#x27E8;&#x27E9;",doc:"&#x1F5CE;",ext:"&#x2197;",refresh:"&#x21bb;",clock:"&#x1F552;"};

let state="gh-list", query="", selIdx=0;
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
function size(b){const kb=b/1024,mb=kb/1024,gb=mb/1024;if(mb<1)return `${Math.round(kb)} KB`;if(gb>=1)return `${gb.toFixed(1)} GB`;return mb<100?`${mb.toFixed(1)} MB`:`${Math.round(mb)} MB`;}
function announce(t){document.getElementById("live").textContent=t||"";document.getElementById("liveEcho").textContent=t||"none";}

/* ---------- Components ---------- */
function banner(sev,title,msg,acts=[],dismiss=false){
 const glyph={error:G.err,warning:G.warn,info:G.info,success:G.ok}[sev];
 const role=sev==="error"?"alert":"status";
 return `<div class="banner ${sev==="info"?"":sev}" role="${role}" tabindex="-1" data-banner aria-label="${esc(title+" "+msg)}">
  <span class="g" aria-hidden="true">${glyph}</span>
  <div class="msg"><div class="label">${esc(title)}</div><div>${esc(msg)}</div></div>
  <div class="acts">${acts.map(a=>`<button class="link-btn" ${a.go?`data-go="${a.go}"`:""} aria-label="${esc(a.name||a.text)}">${esc(a.text)}${a.ext?` <span aria-hidden="true">${G.ext}</span>`:""}</button>`).join("")}
  ${dismiss?`<button class="icon-btn" aria-label="${S.dismiss}">${G.err}</button>`:""}</div></div>`;
