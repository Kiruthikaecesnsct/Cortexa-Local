[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seeding"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.9",
    "azure-cosmos>=4.7",
    "azure-monitor-opentelemetry>=1.8",
    "azure-identity>=1.16",
    "azure-servicebus>=7.12",
    "aio-pika>=10.0.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sentry-sdk[fastapi]>=2.44,<3",
    "tenacity>=8.0",
    "uvicorn[standard]>=0.29",
]

[tool.hatch.build.targets.wheel]
packages = ["src/seeding"]

[tool.uv]
package = true
dev-dependencies = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.4",
    "pip-audit>=2.7",
]

[tool.uv.sources]
seeding = { path = "src" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
